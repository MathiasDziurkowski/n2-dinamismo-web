<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>N2</title>
  </head>
  <body>
    <div>
      <div id="adicionar">
        <button id="btn-adicionar">adicionar</button>
        <select id="select-adicionar">
          <option value="users">usuarios</option>
          <option value="post">postagens</option>
        </select>
        <div id="adicionar-postagem">
          <input type="text" id="title" name="title" placeholder="titulo" />
          <input
            type="text"
            id="body"
            name="body"
            placeholder="corpo da postagem"
          />
        </div>
        <div id="adicionar-usuario">
          <input type="text" id="name" name="name" placeholder="nome" />
          <input
            type="text"
            id="username"
            name="username"
            placeholder="apelido"
          />
          <input type="text" id="email" name="email" placeholder="email" />
          <input type="text" id="street" name="street" placeholder="rua" />
          <input type="text" id="city" name="city" placeholder="cidade" />
          <input type="text" id="zipcode" name="zipcode" placeholder="cep" />
          <input type="text" id="phone" name="phone" placeholder="telefone" />
        </div>
      </div>

      <div id="editar">
        <button>editar</button>
        <select name="" id="">
          <option value="users">usuarios</option>
          <option value="post">postagens</option>
        </select>
        <div id="editar-postagem">
          <input type="text" placeholder="titulo" name="title" />
          <input type="text" placeholder="corpo da postagem" name="body" />
        </div>
        <div id="editar-usuario">
          <input type="text" placeholder="nome" name="name" />
          <input type="text" placeholder="apelido" name="username" />
          <input type="text" placeholder="email" name="email" />
          <input type="text" placeholder="rua" name="street" />
          <input type="text" placeholder="cidade" name="city" />
          <input type="text" placeholder="cep" name="zipcode" />
          <input type="text" placeholder="telefone" name="phone" />
        </div>
      </div>

      <div id="remover">
        <button>remover</button>
        <input type="text" placeholder="indice" name="id" />
      </div>
    </div>
  </body>
</html>
