<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>N3</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div>
      <div id="adicionar">
        <button id="btn-adicionar">adicionar</button>

        <div id="adicionar-postagem">
          <input type="text" id="title" name="title" placeholder="Título*" />
          <input
            type="text"
            id="body"
            name="body"
            placeholder="Corpo da Postagem*"
          />
          <select name="userId" id="userId">
          </select>
        </div>
        <div id="adicionar-usuario">
          <input type="text" id="name" name="name" placeholder="Nome*" />
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Apelido"
          />
          <input type="email" id="email" name="email" placeholder="Email*" />
          <input type="text" id="street" name="street" placeholder="Rua" />
          <input type="text" id="city" name="city" placeholder="Cidade" />
          <input type="text" id="zipcode" name="zipcode" placeholder="CEP" />
          <input type="tel" id="phone" name="phone" placeholder="Telefone" />
        </div>
      </div>

      <div id="editar">
        <button id="btn-editar">editar</button>
        <div id="editar-postagem">
          <input type="text" id="edit-title" name="title" placeholder="Título*">
          <input type="text" id="edit-body" name="body" placeholder="Corpo da Postagem*">
        </div>
        <div id="editar-usuario">
          <input type="text" id="edit-name" name="name" placeholder="Nome*">
          <input type="text" id="edit-username" name="username" placeholder="Apelido">
          <input type="email" id="edit-email" name="email" placeholder="Email*">
          <input type="text" id="edit-street" name="street" placeholder="Rua">
          <input type="text" id="edit-city" name="city" placeholder="Cidade">
          <input type="text" id="edit-zipcode" name="zipcode" placeholder="CEP">
          <input type="tel" id="edit-phone" name="phone" placeholder="Telefone">
        </div>
      </div>

      <div id="remover">
        <button id="btn-remover">remover</button>
      </div>
    </div>
    <div>
    <select name="opção" id="opt">
        <option value="post" selected>Postagem</option>
        <option value="user">Usuários</option>
    </select>    
    <input type="text" id="search" name="search" placeholder="Pesquisar">
    <div id="lista-postagens"></div>
    <div id="lista-usuarios"></div>
    </div>

    <div id="loading">Carregando...</div>

    <div id="notificação">
      <h1 id="notificação-titulo"></h1>
      <p id="notificação-corpo"></p>
    </div>


    <dialog id="dialogRemover">
        <h1></h1>
        <button id="btn-remover-cancelar">Cancelar</button>
        <button id="btn-remover-confirmar">Confirmar</button>
    </dialog>

    <dialog id="dialogEditar">
        <h1></h1>
        <button id="btn-editar-cancelar">Cancelar</button>
        <button id="btn-editar-confirmar">Confirmar</button>
    </dialog>

    <dialog id="dialogAdicionar">
        <h1></h1>
        <button id="btn-adicionar-cancelar">Cancelar</button>
        <button id="btn-adicionar-confirmar">Confirmar</button>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
